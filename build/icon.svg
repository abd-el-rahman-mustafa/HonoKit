<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    HonoKit's mark (decisions §72; refined 2026-10-04): a kit for PDFs and pictures, lit by 炎
    (honō, "flame"). A violet PDF page (folded corner, a crease) and a shorter photo (3:4; a gold
    sky, violet hills, a sun) lean in close behind a flame folded from paper; the fire's glow
    falls on the two cards (never on the empty space around them: no disc, no background) and
    their edges nearest the fire catch its light, so the three read as one mark. Two colour families only: violet, and gold to fire. Drawn right to
    left, as Arabic reads: the PDF on the left, the photo on the right. Free-standing, no tile,
    filling its square like the icons around it.
    This is the detailed drawing (64 px and up); build/icon-small.svg is the same mark with fewer
    details for 16–48 px. `npm run icons` renders build/icon.png and build/icon.ico from the two;
    the Logo component in src/renderer/src/components/Home.tsx shows them. The Android app draws
    the same mark (PowerPDF-Android tools/make-icons.js).
    The drawing below is laid out left to right; the outer group mirrors and scales it.
  -->
  <defs>
    <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#6f9bff"/><stop offset=".5" stop-color="#6d46f5"/><stop offset="1" stop-color="#4a2dc4"/></linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ece7ff"/><stop offset="1" stop-color="#9d8aff"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffe27a"/><stop offset="1" stop-color="#f5a524"/></linearGradient>
    <linearGradient id="hills" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#a99bff"/><stop offset="1" stop-color="#7a62f5"/></linearGradient>
    <linearGradient id="hill" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6247e8"/><stop offset="1" stop-color="#3b23a8"/></linearGradient>
    <!-- The fire's light on the edges nearest to it. -->
    <linearGradient id="pageEdge" x1="28" y1="0" x2="42" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff7a6a" stop-opacity=".6"/><stop offset="1" stop-color="#ff7a6a" stop-opacity="0"/></linearGradient>
    <linearGradient id="photoEdge" x1="36" y1="0" x2="25" y2="0" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#ff7a3a" stop-opacity=".55"/><stop offset="1" stop-color="#ff7a3a" stop-opacity="0"/></linearGradient>
    <radialGradient id="light" cx="20" cy="10" r="36" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#fff" stop-opacity=".32"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ffd23f" stop-opacity=".7"/><stop offset=".6" stop-color="#ff9a1c" stop-opacity=".25"/><stop offset="1" stop-color="#ff7a1a" stop-opacity="0"/></radialGradient>
    <radialGradient id="sunGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff" stop-opacity=".6"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="1.3"/></filter>
    <!-- The flame's eight folds, each with its own light. -->
    <linearGradient id="f1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff6a0"/><stop offset="1" stop-color="#ffc21e"/></linearGradient>
    <linearGradient id="f2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffb21e"/><stop offset="1" stop-color="#ff641a"/></linearGradient>
    <linearGradient id="f3" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a2a"/><stop offset="1" stop-color="#e3342c"/></linearGradient>
    <linearGradient id="f4" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff7a2a"/><stop offset="1" stop-color="#f04a2c"/></linearGradient>
    <linearGradient id="f5" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd24d"/><stop offset="1" stop-color="#ff942e"/></linearGradient>
    <linearGradient id="f6" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffe48a"/><stop offset="1" stop-color="#ffb23a"/></linearGradient>
    <linearGradient id="f7" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fffbe6"/><stop offset="1" stop-color="#ffe066"/></linearGradient>
    <linearGradient id="f8" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffc247"/><stop offset="1" stop-color="#ff7a2a"/></linearGradient>
    <polygon id="flameOutline" points="36,4 48,28 47,48 32,60 17,48 19,30 24,16 29,27"/>
    <clipPath id="photoClip"><rect x="13" y="23" width="23" height="31" rx="6"/></clipPath>
    <path id="page" d="M36 12H41L51 22V47a7 7 0 0 1-7 7H35a7 7 0 0 1-7-7V19a7 7 0 0 1 7-7Z"/>
    <path id="pageFold" d="M41 12V17a5 5 0 0 0 5 5H51Z"/>
    <clipPath id="pageClip"><use href="#page"/></clipPath>
    <!-- The two cards, where they stand: the fire's glow lights them and nothing else. -->
    <clipPath id="onCards">
      <rect x="13" y="23" width="23" height="31" rx="6" transform="translate(1.5 0) rotate(-5 28 58)"/>
      <use href="#page" transform="translate(-1.5 0) rotate(5 36 58)"/>
    </clipPath>
  </defs>

  <g transform="translate(32 30.5) scale(-1.22 1.22) translate(-32.1 -35.5)">
    <!-- The photo (3:4, shorter than the page), leaning in. -->
    <g transform="translate(1.5 0) rotate(-5 28 58)">
      <rect x="13" y="23" width="23" height="31" rx="6" fill="url(#gold)"/>
      <g clip-path="url(#photoClip)">
        <polygon points="13,54 13,45 18.5,39 24,45.5 30,38.5 36,44 36,54" fill="url(#hills)"/>
        <polygon points="13,54 17,49 21.5,52.5 26.5,46 36,54" fill="url(#hill)"/>
        <rect x="20" y="20" width="18" height="40" fill="url(#photoEdge)"/>
        <polygon points="13,23 36,23 13,54" fill="#fff" fill-opacity=".14"/>
      </g>
      <circle cx="19.5" cy="30" r="6" fill="url(#sunGlow)"/>
      <circle cx="19.5" cy="30" r="3" fill="#fff"/>
    </g>

    <!-- The PDF page, leaning in from the other side, creased, with its folded corner. -->
    <g transform="translate(-1.5 0) rotate(5 36 58)">
      <use href="#page" transform="translate(-1.8 1.2)" fill="#0b1a40" fill-opacity=".25" filter="url(#soft)"/>
      <use href="#page" fill="url(#violet)"/>
      <g clip-path="url(#pageClip)">
        <polygon points="28,12 51,54 28,54" fill="#1b0f5c" fill-opacity=".15"/>
        <rect x="20" y="0" width="30" height="64" fill="url(#pageEdge)"/>
        <rect width="64" height="64" fill="url(#light)"/>
        <use href="#pageFold" transform="translate(-1.2 1.4)" fill="#1b0f5c" fill-opacity=".4" filter="url(#soft)"/>
      </g>
      <use href="#pageFold" fill="url(#fold)"/>
    </g>

    <!-- The paper flame between them; its glow falls on the cards only, never on empty space. -->
    <circle cx="32.5" cy="39" r="19" fill="url(#glow)" clip-path="url(#onCards)"/>
    <g transform="translate(33.9 37.6) scale(.84) translate(-32.5 -32)">
      <use href="#flameOutline" fill="#1b0f5c" fill-opacity=".42" filter="url(#soft)"/>
    </g>
    <g transform="translate(32.5 35.5) scale(.84) translate(-32.5 -32)" stroke-width=".8" stroke-linejoin="round">
      <polygon points="29,27 36,4 32,40" fill="url(#f1)" stroke="url(#f1)"/>
      <polygon points="36,4 48,28 32,40" fill="url(#f2)" stroke="url(#f2)"/>
      <polygon points="48,28 47,48 32,40" fill="url(#f3)" stroke="url(#f3)"/>
      <polygon points="47,48 32,60 32,40" fill="url(#f4)" stroke="url(#f4)"/>
      <polygon points="32,60 17,48 32,40" fill="url(#f5)" stroke="url(#f5)"/>
      <polygon points="17,48 19,30 32,40" fill="url(#f6)" stroke="url(#f6)"/>
      <polygon points="19,30 29,27 32,40" fill="url(#f7)" stroke="url(#f7)"/>
      <polygon points="24,16 29,27 19,30" fill="url(#f8)" stroke="url(#f8)"/>
    </g>
  </g>
</svg>
