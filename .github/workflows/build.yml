# Builds the installers for Windows, macOS and Linux and publishes them as a GitHub
# Release.
#
# To release: set the version in package.json, then push a tag of the same version,
# e.g. `npm version patch` then `git push --follow-tags`. Pull requests and manual runs
# only typecheck and test.
#
# The release must carry each installer, its .blockmap and the latest*.yml files:
# installed copies read latest.yml (Windows), latest-mac.yml and latest-linux.yml to
# find updates, and the blockmaps make downloads differential.
name: Build

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Typecheck and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches package.json
        if: github.event_name == 'push' && github.ref_type == 'tag'
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version ($expected)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      # Every test document is generated by the suite; the owner's own PDFs are never in the repository.
      - run: npm test

  package:
    name: Package (${{ matrix.os }})
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            script: dist:mac
            artifact: macos
          - os: ubuntu-latest
            script: dist:linux
            artifact: linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run ${{ matrix.script }}
        env:
          # No Apple or Windows certificate yet (docs/release-and-updates.md, "Signing").
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: honopdf-${{ matrix.artifact }}
          path: |
            release/*.exe
            release/*.dmg
            release/*.zip
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            !release/__*
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  windows:
    name: Package (windows, signed)
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: check
    runs-on: windows-latest          # must be GitHub-hosted (origin verification)
    timeout-minutes: 360             # hosted-runner maximum; includes two manual approvals
    permissions:
      contents: read
      actions: read                  # the SignPath action reads job details and the artifact
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
      # A test-signing certificate is not trusted by Windows; only check trust on release-signing.
      VERIFY_TRUST: ${{ vars.SIGNPATH_POLICY_SLUG == 'release-signing' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icons
      - run: npm run build

      - name: Version
        id: ver
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          "version=$v" >> $env:GITHUB_OUTPUT

      # Pass 1: normal pack (writes resources/app-update.yml) and capture the unsigned uninstaller.
      - name: Pass 1 - build, capture the NSIS uninstaller
        shell: pwsh
        env:
          POWERPDF_UNINSTALLER_MODE: capture
          POWERPDF_UNINSTALLER_FILE: ${{ runner.temp }}\signpath\inner\uninstaller\HonoPDF-uninstaller.exe
        run: |
          npx electron-builder --win nsis --x64 --publish never `
            --config electron-builder.signpath.cjs
          if (-not (Test-Path $env:POWERPDF_UNINSTALLER_FILE)) { throw 'uninstaller was not captured' }
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP\signpath\inner\app" | Out-Null
          Copy-Item release\win-unpacked\HonoPDF.exe "$env:RUNNER_TEMP\signpath\inner\app\HonoPDF.exe"
          # the pass-1 installer is thrown away
          Remove-Item release\*.exe, release\*.blockmap, release\latest.yml -ErrorAction SilentlyContinue

      - name: Upload unsigned app exe and uninstaller
        id: up-inner
        uses: actions/upload-artifact@v7
        with:
          name: signpath-inner-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/signpath/inner
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: SignPath request 1 of 2 - HonoPDF.exe and uninstaller
        id: sign-inner
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          # If v3 fails with connector/auth errors (action issue #18), add:
          # connector-url: https://githubactions.connectors.signpath.io
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: inner-binaries
          github-artifact-id: ${{ steps.up-inner.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: ${{ runner.temp }}/signpath/inner-signed
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}
            exeVersion: ${{ toJSON(format('{0}.0', steps.ver.outputs.version)) }}

      - name: Put the signed HonoPDF.exe back and check both signatures
        shell: pwsh
        run: |
          $signed = "$env:RUNNER_TEMP\signpath\inner-signed"
          Copy-Item "$signed\app\HonoPDF.exe" release\win-unpacked\HonoPDF.exe -Force
          foreach ($f in @('release\win-unpacked\HonoPDF.exe', "$signed\uninstaller\HonoPDF-uninstaller.exe")) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($null -eq $s.SignerCertificate) { throw "$f is not signed" }
            if ($env:VERIFY_TRUST -eq 'true' -and ($s.Status -ne 'Valid' -or $s.SignerCertificate.Subject -notlike '*CN=SignPath Foundation*')) {
              throw "$f : $($s.Status)"
            }
          }

      # Pass 2: installers from the signed app folder; the hook injects the signed uninstaller.
      - name: Pass 2 - installer and portable from the signed app
        shell: pwsh
        env:
          POWERPDF_UNINSTALLER_MODE: inject
          POWERPDF_UNINSTALLER_FILE: ${{ runner.temp }}\signpath\inner-signed\uninstaller\HonoPDF-uninstaller.exe
        run: |
          npx electron-builder --win nsis portable --x64 --publish never `
            --prepackaged release/win-unpacked `
            --config electron-builder.signpath.cjs
          $v = '${{ steps.ver.outputs.version }}'
          $stage = "$env:RUNNER_TEMP\signpath\installers"
          New-Item -ItemType Directory -Force $stage | Out-Null
          Copy-Item "release\HonoPDF-Setup-$v.exe", "release\HonoPDF-$v-portable.exe" $stage

      - name: Upload unsigned installers
        id: up-installers
        uses: actions/upload-artifact@v7
        with:
          name: signpath-installers-${{ steps.ver.outputs.version }}
          path: ${{ runner.temp }}/signpath/installers
          if-no-files-found: error
          retention-days: 1
          overwrite: true

      - name: SignPath request 2 of 2 - installer and portable
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3.0
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.up-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 10800
          output-artifact-directory: ${{ runner.temp }}/signpath/installers-signed
          parameters: |
            version: ${{ toJSON(steps.ver.outputs.version) }}

      - name: Put the signed installers back, refresh update info, verify
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $signed = "$env:RUNNER_TEMP\signpath\installers-signed"
          Copy-Item "$signed\HonoPDF-Setup-$v.exe", "$signed\HonoPDF-$v-portable.exe" release -Force
          node scripts/refresh-win-update-info.mjs release
          foreach ($f in @("release\HonoPDF-Setup-$v.exe", "release\HonoPDF-$v-portable.exe", 'release\win-unpacked\HonoPDF.exe')) {
            $s = Get-AuthenticodeSignature $f
            Write-Host "$f : $($s.Status) $($s.SignerCertificate.Subject)"
            if ($null -eq $s.SignerCertificate) { throw "$f is not signed" }
            if ($env:VERIFY_TRUST -eq 'true' -and $s.Status -ne 'Valid') { throw "$f : $($s.Status)" }
          }

      - uses: actions/upload-artifact@v4
        with:
          name: honopdf-windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
          if-no-files-found: error
          retention-days: 1
          overwrite: true

  publish:
    name: Publish release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [package, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    concurrency:
      group: publish-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: honopdf-*
          path: installers
          merge-multiple: true

      - name: Every installer and update file is present
        run: |
          ls -la installers
          missing=0
          expect() {
            count=$(find installers -maxdepth 1 -type f -name "$1" | wc -l | tr -d ' ')
            if [ "$count" -lt "$2" ]; then
              echo "::error::Expected at least $2 $3 ($1), found $count."
              missing=1
            fi
          }
          expect 'HonoKit-Setup-*.exe' 1 'Windows installer'
          expect '*-portable.exe' 1 'Windows portable'
          expect '*.dmg' 2 'macOS disk images'
          expect '*.zip' 2 'macOS update archives'
          expect '*.AppImage' 1 'Linux AppImage'
          expect '*.deb' 1 'Debian package'
          expect 'latest.yml' 1 'Windows update feed'
          expect 'latest-mac.yml' 1 'macOS update feed'
          expect 'latest-linux.yml' 1 'Linux update feed'
          if [ "$missing" -ne 0 ]; then
            echo "::error::Some build files are missing. Re-run all jobs, not only the failed ones."
            exit 1
          fi

      # Into the public releases repository (decisions §73), always marked "Latest": the updater
      # reads only that release, and Android's releases there are never marked Latest.
      # RELEASES_TOKEN: a fine-grained token with Contents read/write on HonoKit-Releases only.
      - name: Create the release and attach the files
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          GH_REPO: abd-el-rahman-mustafa/HonoKit-Releases
        run: |
          cat > "$RUNNER_TEMP/notes.md" <<'NOTES'
          ## Download

          | Computer | File |
          | --- | --- |
          | **Windows** (recommended) | `HonoKit-Setup-…exe` — installs, and updates itself |
          | Windows, no installation | `HonoKit-…-portable.exe` — runs from anywhere; does not update itself |
          | Mac with Apple Silicon (M1 or later) | the `.dmg` with **arm64** in its name |
          | Mac with Intel | the `.dmg` with **x64** in its name |
          | Linux, any distribution | the `.AppImage` — updates itself |
          | Debian or Ubuntu | the `.deb` |

          The `.zip`, `.blockmap` and `latest*.yml` files are what installed copies use to update; you do not need them.

          These builds are not yet signed with a Windows or Apple certificate, so the first launch asks for confirmation once:

          - **Windows**: on "Windows protected your PC", click **More info**, then **Run anyway**.
          - **macOS 15 and later**: open the app once, then System Settings → Privacy & Security → **Open Anyway**.
          - **macOS 14 and earlier**: Control-click the app, choose **Open**, then **Open** again.

          Your files never leave your computer: the only connection HonoKit makes is the update check, which can be turned off in Settings.
          NOTES
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" installers/* --clobber
            gh release edit "$GITHUB_REF_NAME" --latest
          else
            gh release create "$GITHUB_REF_NAME" installers/* \
              --title "HonoKit ${GITHUB_REF_NAME#v}" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi

      - name: Delete this run's build files
        run: |
          ids=$(gh api "repos/$GH_REPO/actions/runs/$GITHUB_RUN_ID/artifacts" --paginate --jq '.artifacts[].id')
          for id in $ids; do
            gh api -X DELETE "repos/$GH_REPO/actions/artifacts/$id"
          done
